<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Lumina Bible</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f4f7fb; color: #22272e; display: grid; place-items: center; min-height: 100vh; }
      .card { background: #fff; border-radius: 20px; padding: 32px; max-width: 340px; text-align: center; box-shadow: 0 8px 24px rgba(16,24,40,.06); margin: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #7c8794; font-size: 14px; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; background: #5b7fb4; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 999px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Previously opened chapters are still available. Reconnect to sync new content.</p>
      <a href="/">Go to Bible</a>
    </div>
  </body>
</html>
